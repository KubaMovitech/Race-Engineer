name: Controllo versione

on:
  push:
  pull_request:

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
      - name: Versione, SHA-256 e app coerenti
        run: python3 tools/check_release.py
      - name: Funzioni avvolte tra i file (ordine di caricamento)
        run: python3 tools/check_overrides.py
      - name: Test del bridge
        working-directory: bridge
        run: |
          cp ../Data_Engineer.html app.html
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test di tutte le schermate (bridge demo + telemetria finta)
        run: |
          (cd bridge && go build -o /tmp/de-bridge .)
          python3 tools/make_fixture_ld.py /tmp/fixture.ld
          (/tmp/de-bridge -demo -nowindow -speed 8 > /tmp/de-bridge.log 2>&1 &)
          npm install --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
          sleep 3
          node tools/smoke.js http://localhost:8790/ /tmp/fixture.ld
